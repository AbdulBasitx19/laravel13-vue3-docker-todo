services:
  # Container 1: Web Application (Laravel + Apache Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vue_laravel_app
    restart: unless-stopped
    ports:
      - "8000:80"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./src:/var/www/html
    networks:
      - app_net

  # Container 2: Vue Frontend (Vite Dev Server - Separate Container)
  vue-dev:
    image: node:20-alpine
    container_name: vue_laravel_vue
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    networks:
      - app_net

  # Container 3: MySQL Database
  db:
    image: mysql:latest
    container_name: vue_laravel_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: app_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: app_user
      MYSQL_PASSWORD: userpassword
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app_net

  # Container 4: Database GUI phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: vue_laravel_phpmyadmin
    restart: unless-stopped
    ports:
      - "8888:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  dbdata:
    driver: local
    